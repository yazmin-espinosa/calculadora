<!doctype html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="images/favicon.png">
        <link rel="stylesheet" href="css/style.css">
        <title>CALCULADORA</title>
    </head>

    <body>
        
        <form id="miFormulario">
            <label>NUMERO 1</label><br>
            <input type="number" name="numero_1" id="numero_1"><br>

            <label>NUMERO 2</label><br>
            <input type="number" name="numero_2" id="numero_2"><br>

            <label>RESULTADO</label><br>
            <!-- 'readonly' no permite escribir el resultado a mano -->
            <input type="number" name="resultado" id="resultado" readonly><br><br>

            <button id="mi_boton" type="button">Sumar</button><br>
            <button id="mi_boton2" type="button">Restar</button><br>
            <button id="mi_boton3" type="button">Dividir</button><br>
            <button id="mi_boton4" type="button">Multiplicar</button><br>
        </form>

        <script src="js/script.js"></script>
        
    </body>

</html>
